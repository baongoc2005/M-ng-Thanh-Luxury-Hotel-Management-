  <style>
    /* ===== BRAND PAGE SPECIFIC ===== */
    :root { --accent: var(--gold); }

    /* NAV AUTH */
    .nav-auth { display:flex; align-items:center; margin-left:0.8rem; }
    .nav-login-btn {
      font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase;
      color:var(--gold); border:1px solid rgba(201,169,110,0.4);
      padding:0.45rem 1.1rem; transition:all 0.3s; white-space:nowrap;
    }
    .nav-login-btn:hover { background:rgba(201,169,110,0.08); }
    .nav-user-btn {
      font-size:0.72rem; letter-spacing:0.1em; color:var(--white);
      display:flex; align-items:center; gap:0.5rem;
      padding:0.4rem 0.8rem; border:1px solid transparent; transition:all 0.3s;
    }
    .nav-user-btn:hover { border-color:var(--border); }
    .nav-user-avatar {
      width:28px; height:28px; border-radius:50%; background:rgba(201,169,110,0.15);
      border:1px solid rgba(201,169,110,0.4); display:flex; align-items:center;
      justify-content:center; font-family:var(--font-serif); font-size:0.85rem; color:var(--gold);
    }

    /* ===== HERO ===== */
    .brand-hero {
      position: relative; height: 100vh; min-height: 600px;
      display: flex; align-items: flex-end;
      overflow: hidden;
    }
    .brand-hero-bg {
      position: absolute; inset: 0;
    }
    .brand-hero-bg img {
      width: 100%; height: 100%; object-fit: cover;
      transform: scale(1.05);
      transition: transform 8s ease;
    }
    .brand-hero.loaded .brand-hero-bg img { transform: scale(1); }
    .brand-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,10,10,0.92) 0%, rgba(10,10,10,0.3) 60%, rgba(10,10,10,0.1) 100%);
    }
    .brand-hero-content {
      position: relative; z-index: 2;
      padding: 0 6vw 5rem;
      max-width: 800px;
    }
    .brand-hero-breadcrumb {
      font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(245,240,234,0.45); margin-bottom: 1.2rem;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .brand-hero-breadcrumb a { color: inherit; text-decoration: none; transition: color 0.2s; }
    .brand-hero-breadcrumb a:hover { color: var(--gold); }
    .brand-hero-breadcrumb span { opacity: 0.4; }

    .brand-hero-icon {
      font-size: 2rem; color: var(--gold); margin-bottom: 1rem;
      display: block;
    }
    .brand-hero-label {
      font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 0.8rem;
    }
    .brand-hero-title {
      font-family: var(--font-serif); font-weight: 300;
      font-size: clamp(2.8rem, 6vw, 5rem); line-height: 1.05;
      color: var(--white); margin-bottom: 1.2rem;
    }
    .brand-hero-title em { font-style: italic; color: var(--gold); }
    .brand-hero-desc {
      font-size: 0.95rem; line-height: 1.7; color: rgba(245,240,234,0.7);
      max-width: 560px; margin-bottom: 2rem;
    }
    .brand-hero-cta {
      display: inline-block;
      font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--black); background: var(--gold);
      padding: 0.85rem 2.2rem; text-decoration: none;
      transition: all 0.3s;
    }
    .brand-hero-cta:hover { background: #b8924a; }

    /* ===== STATS BAR ===== */
    .brand-stats {
      background: rgba(201,169,110,0.06);
      border-top: 1px solid rgba(201,169,110,0.15);
      border-bottom: 1px solid rgba(201,169,110,0.15);
    }
    .brand-stats-inner {
      display: grid; grid-template-columns: repeat(5, 1fr);
      max-width: 1100px; margin: 0 auto;
    }
    .stat-item {
      padding: 2rem 1.5rem; text-align: center;
      border-right: 1px solid rgba(201,169,110,0.12);
    }
    .stat-item:last-child { border-right: none; }
    .stat-num {
      font-family: var(--font-serif); font-size: 2.4rem; font-weight: 300;
      color: var(--gold); line-height: 1; margin-bottom: 0.4rem;
    }
    .stat-lbl {
      font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(245,240,234,0.45); line-height: 1.4;
    }

    /* ===== PILLARS ===== */
    .brand-pillars {
      padding: 6rem 6vw;
      max-width: 1200px; margin: 0 auto;
    }
    .pillars-header {
      text-align: center; margin-bottom: 4rem;
    }
    .pillars-label {
      font-size: 0.65rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 0.8rem;
    }
    .pillars-title {
      font-family: var(--font-serif); font-size: clamp(2rem, 3.5vw, 2.8rem);
      font-weight: 300; color: var(--white); line-height: 1.15;
    }
    .pillars-title em { font-style: italic; color: var(--gold); }
    .pillars-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
      background: rgba(201,169,110,0.1);
    }
    .pillar-card {
      background: var(--dark); padding: 3rem 2.5rem;
      border-bottom: 3px solid transparent;
      transition: border-color 0.3s, background 0.3s;
    }
    .pillar-card:hover {
      border-bottom-color: var(--gold);
      background: rgba(201,169,110,0.04);
    }
    .pillar-card::before {
      content: '';
      display: block;
      width: 32px; height: 1px;
      background: var(--gold);
      margin-bottom: 2rem;
      opacity: 0.7;
    }
    .pillar-name {
      font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 1rem;
    }
    .pillar-title {
      font-family: var(--font-serif); font-size: 1.6rem; font-weight: 300;
      color: var(--white); margin-bottom: 1rem; line-height: 1.2;
    }
    .pillar-desc {
      font-size: 0.82rem; line-height: 1.7; color: rgba(245,240,234,0.55);
    }

    /* 2-pillar layout */
    .pillars-grid.two-col { grid-template-columns: repeat(2, 1fr); }

    /* ===== HOTELS LIST ===== */
    .brand-hotels {
      padding: 0 6vw 6rem;
    }
    .hotels-header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid rgba(201,169,110,0.12);
      padding-bottom: 1.2rem;
    }
    .hotels-header-title {
      font-family: var(--font-serif); font-size: 1.6rem; font-weight: 300;
      color: var(--white);
    }
    .hotels-header-count {
      font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--gold);
    }
    .hotels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1px; background: rgba(201,169,110,0.08);
    }
    .hotel-item {
      background: var(--dark); padding: 1.4rem 1.6rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
    }
    .hotel-item:hover { background: rgba(201,169,110,0.06); }
    .hotel-item-left { flex: 1; min-width: 0; }
    .hotel-item-name {
      font-size: 0.85rem; font-weight: 500; color: var(--white);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 0.25rem;
    }
    .hotel-item-city {
      font-size: 0.68rem; letter-spacing: 0.1em; color: rgba(245,240,234,0.4);
    }
    .hotel-item-arrow {
      font-size: 0.75rem; color: var(--gold); opacity: 0.5;
      transition: opacity 0.2s, transform 0.2s; flex-shrink: 0;
    }
    .hotel-item:hover .hotel-item-arrow { opacity: 1; transform: translateX(4px); }

    /* ===== CTA SECTION ===== */
    .brand-cta {
      margin: 0 6vw 6rem;
      background: rgba(201,169,110,0.05);
      border: 1px solid rgba(201,169,110,0.2);
      padding: 4rem; text-align: center;
    }
    .brand-cta-title {
      font-family: var(--font-serif); font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 300; color: var(--white); margin-bottom: 1rem;
    }
    .brand-cta-title em { color: var(--gold); font-style: italic; }
    .brand-cta-desc {
      font-size: 0.85rem; color: rgba(245,240,234,0.5);
      margin-bottom: 2rem; line-height: 1.6;
    }
    .brand-cta-btn {
      display: inline-block;
      font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--black); background: var(--gold);
      padding: 0.9rem 2.4rem; text-decoration: none;
      transition: background 0.3s;
    }
    .brand-cta-btn:hover { background: #b8924a; }

    /* ===== OTHER BRANDS ===== */
    .other-brands {
      padding: 0 6vw 6rem;
    }
    .other-brands-label {
      font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(245,240,234,0.35); margin-bottom: 1.5rem;
    }
    .other-brands-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
      background: rgba(201,169,110,0.08);
    }
    .other-brand-item {
      background: var(--dark); padding: 1.5rem 2rem;
      display: flex; flex-direction: column; gap: 0.4rem;
      text-decoration: none; transition: background 0.2s;
    }
    .other-brand-item:hover { background: rgba(201,169,110,0.06); }
    .ob-icon { font-size: 1rem; color: var(--gold); }
    .ob-name { font-family: var(--font-serif); font-size: 1.1rem; color: var(--white); }
    .ob-count { font-size: 0.68rem; letter-spacing: 0.1em; color: rgba(245,240,234,0.35); text-transform: uppercase; }
    .ob-arrow { font-size: 0.7rem; color: var(--gold); margin-top: 0.5rem; opacity: 0.5; }
    .other-brand-item:hover .ob-arrow { opacity: 1; }

    /* ===== FOOTER ===== */
    .brand-footer-divider {
      border: none; border-top: 1px solid rgba(201,169,110,0.1);
      margin: 0 6vw;
    }

    @media (max-width: 768px) {
      .brand-stats-inner { grid-template-columns: repeat(3, 1fr); }
      .stat-item:nth-child(3) { border-right: none; }
      .pillars-grid, .pillars-grid.two-col { grid-template-columns: 1fr; }
      .hotels-grid { grid-template-columns: 1fr; }
      .other-brands-grid { grid-template-columns: 1fr; }
      .brand-cta { padding: 2.5rem 1.5rem; }
    }
  </style>
</head>
