<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Đăng Nhập — Admin Mường Thanh</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --black:#080808;--dark:#0f0f0f;--card:#161616;
      --border:rgba(255,255,255,0.08);
      --gold:#c9a96e;--gold-l:#e8c98a;
      --white:#f5f0ea;--muted:rgba(245,240,234,0.5);
      --red:#e05555;--green:#4caf7d;
      --font-serif:'Cormorant Garamond',Georgia,serif;
      --font-sans:'Inter',system-ui,sans-serif;
    }
    body{background:var(--black);color:var(--white);font-family:var(--font-sans);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;}
    body::before{content:'';position:fixed;inset:0;
      background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(201,169,110,0.04) 0%,transparent 60%),
                 radial-gradient(ellipse 60% 80% at 80% 90%,rgba(201,169,110,0.03) 0%,transparent 60%);
      pointer-events:none;}
    .card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);padding:2.5rem 2rem 2rem;position:relative;}
    .logo{text-align:center;margin-bottom:2rem;}
    .logo-name{font-family:var(--font-serif);font-size:2rem;font-weight:300;letter-spacing:.2em;color:var(--gold);}
    .logo-sub{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:.4rem;}
    .logo-badge{display:inline-block;margin-top:.8rem;font-size:.6rem;font-weight:600;letter-spacing:.15em;
      text-transform:uppercase;background:rgba(201,169,110,0.12);color:var(--gold);
      border:1px solid rgba(201,169,110,0.25);padding:.2rem .8rem;}
    .field{margin-bottom:1rem;}
    .field label{display:block;font-size:.7rem;font-weight:500;letter-spacing:.1em;
      text-transform:uppercase;color:var(--muted);margin-bottom:.4rem;}
    .field input{width:100%;padding:.7rem .9rem;background:rgba(255,255,255,0.04);
      border:1px solid var(--border);color:var(--white);font-family:var(--font-sans);
      font-size:.875rem;outline:none;transition:border-color .3s;}
    .field input:focus{border-color:rgba(201,169,110,0.5);}
    .field input::placeholder{color:rgba(245,240,234,0.25);}
    .btn{width:100%;padding:.9rem;background:var(--gold);color:var(--black);
      font-family:var(--font-sans);font-size:.8rem;font-weight:600;letter-spacing:.18em;
      text-transform:uppercase;border:none;cursor:pointer;transition:background .3s;margin-top:.5rem;}
    .btn:hover{background:var(--gold-l);}
    .btn:disabled{opacity:.6;cursor:not-allowed;}
    .msg{padding:.65rem .9rem;font-size:.8rem;margin-top:.75rem;display:none;border-left:3px solid;}
    .msg.err{display:block;background:rgba(224,85,85,0.1);border-color:var(--red);color:#f08080;}
    .spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(8,8,8,0.3);
      border-top-color:var(--black);border-radius:50%;animation:spin .7s linear infinite;
      vertical-align:middle;margin-right:5px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .back{display:block;text-align:center;margin-top:1.5rem;font-size:.72rem;color:var(--muted);
      text-decoration:none;letter-spacing:.08em;}
    .back:hover{color:var(--gold);}
  </style>
</head>
<body>
  <div class="card">
    <div style="position:absolute;top:1rem;right:1rem;display:flex;align-items:center;gap:0.2rem;">
      <button onclick="setAdminLang('vi')" id="langVI" style="background:transparent;border:none;font-size:0.6rem;font-weight:600;letter-spacing:0.12em;cursor:pointer;padding:0.2rem 0.3rem;font-family:inherit;transition:color 0.2s;">VI</button>
      <span style="font-size:0.5rem;color:rgba(255,255,255,0.2)">|</span>
      <button onclick="setAdminLang('en')" id="langEN" style="background:transparent;border:none;font-size:0.6rem;font-weight:600;letter-spacing:0.12em;cursor:pointer;padding:0.2rem 0.3rem;font-family:inherit;transition:color 0.2s;">EN</button>
    </div>
    <div class="logo">
      <div class="logo-name">Mường Thanh</div>
      <div class="logo-sub" id="logoSub">Chuỗi khách sạn tư nhân lớn nhất Đông Dương</div>
      <div class="logo-badge" id="logoBadge">Cổng nhân viên</div>
    </div>

    <div class="field">
      <label id="labelEmail">Email nhân viên</label>
      <input type="email" id="email" placeholder="ten@muongthanh.vn" autocomplete="email"/>
    </div>
    <div class="field">
      <label id="labelPassword">Mật khẩu</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn" id="btnLogin" onclick="doLogin()">Đăng Nhập</button>
    <div class="msg" id="msg"></div>
    <a href="../index.html" class="back" id="backLink">← Quay về trang chủ</a>
  </div>

  <script>
  const ADMIN_LOGIN_I18N = {
    vi: {
      sub: 'Chuỗi khách sạn tư nhân lớn nhất Đông Dương',
      badge: 'Cổng nhân viên',
      email: 'Email nhân viên', password: 'Mật khẩu',
      btn: 'Đăng Nhập', back: '← Quay về trang chủ',
      err_empty: 'Vui lòng nhập đầy đủ thông tin.',
      logging_in: 'Đang đăng nhập...',
      err_fail: 'Đăng nhập thất bại.', err_conn: 'Lỗi kết nối.',
    },
    en: {
      sub: "Indochina's largest private hotel chain",
      badge: 'Staff Portal',
      email: 'Staff email', password: 'Password',
      btn: 'Sign In', back: '← Back to homepage',
      err_empty: 'Please fill in all fields.',
      logging_in: 'Signing in...',
      err_fail: 'Login failed.', err_conn: 'Connection error.',
    }
  };
  function setAdminLang(lang) {
    localStorage.setItem('lang', lang);
    applyAdminLoginLang();
  }
  function applyAdminLoginLang() {
    const lang = localStorage.getItem('lang') || 'vi';
    const s = ADMIN_LOGIN_I18N[lang] || ADMIN_LOGIN_I18N.vi;
    document.getElementById('logoSub').textContent = s.sub;
    document.getElementById('logoBadge').textContent = s.badge;
    document.getElementById('labelEmail').textContent = s.email;
    document.getElementById('labelPassword').textContent = s.password;
    document.getElementById('btnLogin').textContent = s.btn;
    document.getElementById('backLink').textContent = s.back;
    document.getElementById('langVI').style.color = lang === 'vi' ? 'var(--gold)' : 'var(--muted)';
    document.getElementById('langEN').style.color = lang === 'en' ? 'var(--gold)' : 'var(--muted)';
    document.documentElement.lang = lang === 'en' ? 'en' : 'vi';
  }
  document.addEventListener('DOMContentLoaded', applyAdminLoginLang);

  // Nếu đã đăng nhập thì chuyển thẳng vào dashboard
  (async()=>{
    try{
      const r = await fetch('../api/admin_auth.php?action=me',{credentials:'include'});
      const d = await r.json();
      if(d.authenticated) location.replace('dashboard.html');
    }catch(_){}
  })();

  async function doLogin(){
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('btnLogin');
    const msg      = document.getElementById('msg');
    msg.className  = 'msg';
    const _s = ADMIN_LOGIN_I18N[localStorage.getItem('lang')||'vi'] || ADMIN_LOGIN_I18N.vi;
    if(!email||!password){msg.className='msg err';msg.textContent=_s.err_empty;return;}
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span>' + _s.logging_in;
    try{
      const r = await fetch('../api/admin_auth.php?action=login',{
        method:'POST',credentials:'include',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email,password})
      });
      const d = await r.json();
      if(d.success){
        location.replace('dashboard.html');
      }else{
        msg.className='msg err';
        msg.textContent=d.error||_s.err_fail;
        btn.disabled=false;btn.textContent=_s.btn;
      }
    }catch(e){
      msg.className='msg err';msg.textContent=_s.err_conn;
      btn.disabled=false;btn.textContent=_s.btn;
    }
  }
  document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  </script>
</body>
</html>
